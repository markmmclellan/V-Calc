name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild on a schedule so the published op.gg data stays reasonably fresh.
  # Be considerate: each run downloads ~260 pages from op.gg. Every 6 hours is plenty.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh the op.gg usage data. If op.gg is unreachable or changes its page format, the scraper leaves
      # public/data/champions.json untouched, so the site still deploys with the last committed data.
      - name: Scrape op.gg
        run: npm run scrape
        continue-on-error: true

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
